<script>
function loadJSONWithFallback(url, embeddedId) {
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).catch(function(err){
    var el = document.getElementById(embeddedId);
    if (el) {
      try { return JSON.parse(el.textContent); }
      catch (parseErr) { throw err; }
    }
    throw err;
  });
}

/* =========================================================================
 * 14 — Material Outflow Impact · combines 13_material_outflow_diversion

.wrap{ padding-bottom:16px !important; }

.dual-row{ display:flex; gap:20px; align-items:flex-start; }
.dual-row .chart{ flex:1; min-width:0; }
@media (max-width: 860px){
  .dual-row{ flex-direction:column; }
}

.panel-sub{ font-size:11.5px; color:var(--text-mute); margin-top:-8px; margin-bottom:12px; }

.chart-canvas-wrap{ position:relative; width:100%; aspect-ratio:1/1; }
.chart-canvas-wrap canvas{ display:block; width:100%; height:100%; }

.treemap-wrap{
  position:relative; width:100%; aspect-ratio:1/1;
  border-radius:10px; overflow:hidden; background:var(--bg-2);
}
.tile{
  position:absolute; box-sizing:border-box; border:2px solid var(--panel);
  padding:9px 10px; overflow:hidden; transition: filter .15s ease, z-index 0s; cursor:default;
}
.tile:hover{ filter:brightness(1.06) saturate(1.08); z-index:5; }
.tile .t-name{ font-weight:700; font-size:13px; line-height:1.25; }
.tile .t-val{ font-family:var(--font-mono); font-size:11px; margin-top:3px; opacity:0.92; }

.tile.expanded .t-label{ display:none; }
.tile.expanded:hover{ filter:none; }
/* Below this size, border-box still needs room for padding+border, which can force
   the rendered box past its declared width/height and overlap neighbours. For slivers
   thinner than that chrome, strip padding/border down to a hairline so the box renders
   close to its true allocated size instead. */
.tile.sliver{ padding:0; border-width:1px; }
.subtile.sliver{ padding:0; border-width:1px; }

/* ---- Sub-tiles: hover-revealed material breakdown within a pathway tile ---- */
.subtile{

  box-sizing:border-box;

<script>
/* =========================================================================
 * Shared helpers
 * ========================================================================= */
function fmtMass(v) {
  if (v === 0) return '0 kg';
  const av = Math.abs(v);
  if (av >= 1000) return (v / 1000).toLocaleString('en-AU', { maximumFractionDigits: 2 }) + ' t';
  if (av >= 1)     return Math.round(v).toLocaleString('en-AU') + ' kg';
  return v.toFixed(2) + ' kg';
}
function fmtWe(v) {
  if (v === 0) return '0 kg CO₂e';
  const av = Math.abs(v);
  if (av >= 1000) return (v / 1000).toLocaleString('en-AU', { maximumFractionDigits: 2 }) + ' t CO₂e';
  if (av >= 1)     return v.toFixed(1) + ' kg CO₂e';
  return v.toFixed(3) + ' kg CO₂e';
}
function debounce(fn, wait) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); }; }
function materialFamily(s) {
  if (!s) return 'Mixed';
  const p = s.split(':')[0].trim();
  if (p === 'Metal')    return 'Metal';
  if (p === 'Wood')     return 'Wood';
  if (p === 'Polymer')  return 'Polymer';
  if (p === 'Glass' || s === 'Glass') return 'Glass';
  if (p === 'Composite' || s === 'Composite') return 'Composite';
  if (s.startsWith('Electronics')) return 'Electronics';
  if (s === 'Foam & Insulation') return 'Foam & Insulation';
  if (s === 'Textile')  return 'Textile';
  if (p === 'Ceramic')  return 'Ceramic';
  if (s === 'Paper & Cardboard') return 'Paper & Cardboard';
  return 'Mixed';
}
function textColorFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 0.58 ? '#1A1816' : '#FFFFFF';
}

/* =========================================================================
 * Tile colour — translucent instead of flat solid. We blend each pathway/
 * material colour against the treemap's own background (--bg-2) at a fixed
 * alpha and bake the result into a solid hex, rather than using a literal
 * CSS rgba() background — that way textColorFor() always judges contrast
 * against the colour actually on screen, not the pre-blend source hex.
 * ========================================================================= */
const TILE_ALPHA = 0.62;
const TREEMAP_BG = (getComputedStyle(document.documentElement).getPropertyValue('--bg-2') || '#ECE9E3').trim();

function hexToRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function blendOverBg(hex, alpha, bgHex) {
  const [r, g, b] = hexToRgb(hex);
  const [bgR, bgG, bgB] = hexToRgb(bgHex);
  const mix = (c, bc) => Math.round(c * alpha + bc * (1 - alpha));
  return '#' + [mix(r, bgR), mix(g, bgG), mix(b, bgB)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function tileColor(hex) { return blendOverBg(hex, TILE_ALPHA, TREEMAP_BG); }

/* =========================================================================
 * LEFT — Donut: Dispose-pathway waste emissions by category
 * ========================================================================= */
let DISPOSED_ROWS = [];
const OTHER_THRESHOLD = 0.02;
// Same material-family palette as the Sankey (05_material_pathway_flow.html) so a
// material like "Metal" reads as the same colour across both charts.
const CAT_COLOR = {
  'Metal':              '#4db5a0',
  'Wood':               '#c5a96a',
  'Polymer':            '#8b78d6',
  'Composite':          '#e07b54',
  'Glass':              '#5b8fd8',
  'Electronics':        '#f59e0b',
  'Foam & Insulation':  '#94a3b8',
  'Textile':            '#ec4899',
  'Ceramic':            '#84cc16',
  'Paper & Cardboard':  '#64748b',
  'Mixed':              '#6b7280',
};
// Asset-category grouping has no Sankey equivalent — keep a distinct fallback palette for it.
const DONUT_PALETTE = ['#E8762B', '#1E1B5C', '#2F8F5A', '#0EA5E9', '#A855F7', '#F59E0B', '#EC4899', '#14B8A6', '#EF4444', '#84CC16', '#6366F1'];

function buildSlices(mode) {
  const key = mode === 'material' ? 'matFamily' : 'assetCat';
  const map = new Map();
  for (const r of DISPOSED_ROWS) {
    const k = r[key] || 'Unknown';
    if (!map.has(k)) map.set(k, { label: k, we: 0, items: [] });
    const g = map.get(k);
    g.we += r.we;
    g.items.push({ name: r.name, we: r.we });
  }
  const slices = Array.from(map.values()).filter(g => g.we > 0).sort((a, b) => b.we - a.we);
  const total = slices.reduce((s, g) => s + g.we, 0) || 1;
  const main = slices.filter(g => g.we / total >= OTHER_THRESHOLD);
  const tiny = slices.filter(g => g.we / total < OTHER_THRESHOLD);
  if (tiny.length < 2) return slices;
  const other = {
    label: 'Other', we: tiny.reduce((s, g) => s + g.we, 0),
    items: tiny.flatMap(g => g.items.map(it => ({ ...it, subLabel: g.label }))),
    isOther: true, subcats: tiny.map(g => ({ label: g.label, we: g.we })),
  };
  return [...main, other].sort((a, b) => b.we - a.we);
}

function createDonut(canvasId, tooltipId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const tooltip = document.getElementById(tooltipId);

  let slices = [];
  let dpr = 1, cW = 0, cH = 0;
  let hovered = -1;
  let geo = null;

  function setup() {
    dpr = window.devicePixelRatio || 1;
    cW = canvas.parentElement.clientWidth;
    cH = canvas.parentElement.clientHeight;
    canvas.style.width = cW + 'px';
    canvas.style.height = cH + 'px';
    canvas.width = Math.round(cW * dpr);
    canvas.height = Math.round(cH * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }

  function computeGeometry() {
    const cx = cW / 2, cy = cH / 2;
    const R = Math.min(cW, cH) * 0.30;
    const r = R * 0.58;
    const total = slices.reduce((s, g) => s + g.we, 0) || 1;

    let angle = -Math.PI / 2;
    const arcs = slices.map((g, i) => {
      const frac = g.we / total;
      const startAngle = angle;
      const endAngle = angle + frac * Math.PI * 2;
      angle = endAngle;
      return { ...g, i, startAngle, endAngle, frac, color: CAT_COLOR[g.label] || DONUT_PALETTE[i % DONUT_PALETTE.length] };
    });

    const labelR = R + 30;
    const GAP_Y = 6;
    const items = arcs.map(a => {
      const mid = (a.startAngle + a.endAngle) / 2;
      const dirX = Math.cos(mid), dirY = Math.sin(mid);
      const anchor = { x: cx + dirX * R, y: cy + dirY * R };
      const target = { x: cx + dirX * labelR, y: cy + dirY * labelR };
      ctx.font = '700 11.5px Geist, Arial, sans-serif';
      const nameW = ctx.measureText(a.label).width;
      ctx.font = '10px "Chivo Mono", monospace';
      const valW = ctx.measureText(`${fmtWe(a.we)} · ${(a.frac * 100).toFixed(0)}%`).width;
      const w = Math.max(nameW, valW) + 6, h = 26;
      return { a, mid, dirX, anchor, target, w, h };
    });

    function box(it) {
      const x0 = it.dirX >= 0 ? it.target.x : it.target.x - it.w;
      return { x0, x1: x0 + it.w, y0: it.target.y - it.h / 2, y1: it.target.y + it.h / 2 };
    }
    function overlaps(b1, b2) { return b1.x0 < b2.x1 && b1.x1 > b2.x0 && b1.y0 < b2.y1 - GAP_Y && b1.y1 > b2.y0 + GAP_Y; }

    const order = [...items].sort((p, q) => p.target.y - q.target.y);
    for (let pass = 0; pass < 4; pass++) {
      for (let i = 1; i < order.length; i++) {
        for (let j = 0; j < i; j++) {
          const bi = box(order[i]), bj = box(order[j]);
          if (overlaps(bi, bj)) {
            const needed = bj.y1 + GAP_Y + order[i].h / 2 - order[i].target.y;
            if (needed > 0) order[i].target.y += needed;
          }
        }
      }
    }

    return { cx, cy, R, r, total, arcs, labels: items };
  }

  function draw() {
    ctx.clearRect(0, 0, cW, cH);
    if (!slices.length) return;
    geo = computeGeometry();
    const { cx, cy, R, r, total, arcs, labels } = geo;

    arcs.forEach(a => {
      const isHov = a.i === hovered;
      const rad = isHov ? R * 1.035 : R;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, (rad + r) / 2, a.startAngle, a.endAngle);
      ctx.lineWidth = rad - r;
      ctx.strokeStyle = a.color;
      ctx.globalAlpha = isHov ? 1 : 0.92;
      ctx.lineCap = 'butt';
      ctx.stroke();
      ctx.restore();
    });

    arcs.forEach(a => {
      ctx.save();
      ctx.strokeStyle = '#F4F2EE';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a.startAngle) * r, cy + Math.sin(a.startAngle) * r);
      ctx.lineTo(cx + Math.cos(a.startAngle) * R * 1.05, cy + Math.sin(a.startAngle) * R * 1.05);
      ctx.stroke();
      ctx.restore();
    });

    ctx.textAlign = 'center';
    ctx.fillStyle = '#1A1816';
    ctx.font = '700 22px Geist, Arial, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(fmtWe(total).split(' ')[0], cx, cy - 2);
    ctx.font = '600 11px "Chivo Mono", monospace';
    ctx.fillStyle = '#57534B';
    ctx.textBaseline = 'top';
    ctx.fillText(fmtWe(total).split(' ').slice(1).join(' '), cx, cy + 6);
    ctx.font = '10px Geist, Arial, sans-serif';
    ctx.fillStyle = '#B5B0A6';
    ctx.fillText('disposed emissions', cx, cy + 22);

    labels.forEach(({ a, dirX, anchor, target }) => {
      const isHov = a.i === hovered;
      ctx.save();
      ctx.strokeStyle = isHov ? a.color : 'rgba(87,83,75,0.35)';
      ctx.lineWidth = isHov ? 1.6 : 1;
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y);
      const bendX = cx + dirX * (geo.R + 12);
      ctx.lineTo(bendX, target.y);
      ctx.lineTo(target.x + (dirX >= 0 ? -2 : 2), target.y);
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = dirX >= 0 ? 'left' : 'right';
      const tx = target.x + (dirX >= 0 ? 4 : -4);
      ctx.font = isHov ? '700 11.5px Geist, Arial, sans-serif' : '600 11.5px Geist, Arial, sans-serif';
      ctx.fillStyle = isHov ? a.color : '#1A1816';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(a.label, tx, target.y - 1);
      ctx.font = '9.5px "Chivo Mono", monospace';
      ctx.fillStyle = '#B5B0A6';
      ctx.textBaseline = 'top';
      ctx.fillText(`${fmtWe(a.we)} · ${(a.frac * 100).toFixed(0)}%`, tx, target.y + 3);
    });
  }

  function hitTest(mx, my) {
    if (!geo) return -1;
    const { cx, cy, R, r, arcs, labels } = geo;
    const dist = Math.hypot(mx - cx, my - cy);
    if (dist >= r - 4 && dist <= R * 1.05 + 4) {
      let ang = Math.atan2(my - cy, mx - cx);
      for (const a of arcs) {
        for (const off of [-2 * Math.PI, 0, 2 * Math.PI]) {
          if (ang + off >= a.startAngle - 0.001 && ang + off <= a.endAngle + 0.001) return a.i;
        }
      }
    }
    for (const { a, dirX, target } of labels) {
      const boxW = 140, boxH = 28;
      const bx = dirX >= 0 ? target.x : target.x - boxW;
      if (mx >= bx - 4 && mx <= bx + boxW + 4 && my >= target.y - 15 && my <= target.y + 15) return a.i;
    }
    return -1;
  }

  function positionTooltip(e) {
    const tw = tooltip.offsetWidth || 220, th = tooltip.offsetHeight || 140;
    const tx = e.clientX + 16 + tw > window.innerWidth ? e.clientX - tw - 12 : e.clientX + 16;
    const ty = e.clientY + 18 + th > window.innerHeight ? e.clientY - th - 12 : e.clientY + 18;
    tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
  }

  function showTooltip(e, arc) {
    const sorted = [...arc.items].sort((a, b) => b.we - a.we);
    let html = `<div class="tt-title"><span class="tt-dot" style="background:${arc.color}"></span>${arc.label}</div>`;
    if (arc.isOther) {
      html += `<div class="tt-note">Categories under ${(OTHER_THRESHOLD * 100).toFixed(0)}% grouped together: ${arc.subcats.map(s => s.label).join(', ')}</div>`;
    }
    sorted.forEach(it => {
      const pct = arc.we > 0 ? (it.we / arc.we * 100) : 0;
      html += `<div class="tt-row">
        <div class="tt-name">${it.name}${it.subLabel ? ` <span class="tt-pct">(${it.subLabel})</span>` : ''}</div>
        <div class="tt-val">${fmtWe(it.we)} <span class="tt-pct">(${pct.toFixed(0)}%)</span></div>
      </div>`;
    });
    html += `<div class="tt-divider"></div>`;
    html += `<div class="tt-row"><div class="tt-name">${arc.label} total</div><div class="tt-val">${fmtWe(arc.we)}</div></div>`;
    html += `<div class="tt-row"><div class="tt-name">Share of disposed emissions</div><div class="tt-val">${(arc.frac * 100).toFixed(1)}%</div></div>`;
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    positionTooltip(e);
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const idx = hitTest(mx, my);
    if (idx !== hovered) { hovered = idx; draw(); }
    if (idx >= 0 && geo) { showTooltip(e, geo.arcs[idx]); canvas.style.cursor = 'pointer'; }
    else { hideTooltip(); canvas.style.cursor = 'default'; }
  });
  canvas.addEventListener('mouseleave', () => { hovered = -1; hideTooltip(); draw(); });
  window.addEventListener('resize', debounce(() => { setup(); draw(); }, 100));

  return { setSlices(newSlices) { slices = newSlices; hovered = -1; setup(); draw(); } };
}


/* =========================================================================
 * RIGHT — Treemap: mass / waste emissions by pathway (Retain excluded)
 * ========================================================================= */
let PATHWAYS = [];
const PATHWAY_COLORS = {
  Stewardship: '#10b981', Reuse: '#34d399', Rehome: '#6ee7b7', Refurbish: '#22d3ee',
  Remanufacture: '#a78bfa', 'Adaptive Reuse': '#818cf8', Recycle: '#f97316', Dispose: '#ef4444',
};
const PALETTE_FALLBACK = ['#0EA5E9', '#A855F7', '#F59E0B', '#EC4899', '#14B8A6', '#6366F1'];

function treemapLayout(items, x, y, w, h) {
  if (!items.length) return [];
  if (items.length === 1) return [{ ...items[0], x, y, w, h }];
  const total = items.reduce((s, i) => s + i.value, 0);
  let cum = 0, bestK = 1, bestDiff = Infinity;
  for (let k = 1; k < items.length; k++) {
    cum += items[k - 1].value;
    const diff = Math.abs(cum / total - 0.5);
    if (diff < bestDiff) { bestDiff = diff; bestK = k; }
  }
  const groupA = items.slice(0, bestK), groupB = items.slice(bestK);
  const sumA = groupA.reduce((s, i) => s + i.value, 0);
  const fracA = total > 0 ? sumA / total : 0.5;
  if (w >= h) {
    const wA = w * fracA;
    return [...treemapLayout(groupA, x, y, wA, h), ...treemapLayout(groupB, x + wA, y, w - wA, h)];
  } else {
    const hA = h * fracA;
    return [...treemapLayout(groupA, x, y, w, hA), ...treemapLayout(groupB, x, y + hA, w, h - hA)];
  }
}

const treeContainer = document.getElementById('treemap');
const treeTooltip = document.getElementById('treeTooltip');
let currentMetric = 'mass';

function positionTreeTooltip(e) {
  const tw = treeTooltip.offsetWidth || 220, th = treeTooltip.offsetHeight || 140;
  const tx = e.clientX + 16 + tw > window.innerWidth ? e.clientX - tw - 12 : e.clientX + 16;
  const ty = e.clientY + 18 + th > window.innerHeight ? e.clientY - th - 12 : e.clientY + 18;
  treeTooltip.style.left = tx + 'px'; treeTooltip.style.top = ty + 'px';
}
function totalOf(metric) { return PATHWAYS.reduce((s, p) => s + p[metric], 0); }

// Every pathway tile sub-divides into a material-family mini-treemap on
// hover, regardless of how small the tile is — including single-material
// pathways (Stewardship, Adaptive Reuse, Refurbish), where the "breakdown"
// is just that one material filling the tile. Individual material
// slices that end up too small to read still render (as colour only);
// buildSubTiles()'s tinySub/sliverSub classes drop just the text label,
// not the slice itself, once it's under ~46x26px.
function canExpand(r) {
  return !!(r.materials && r.materials.length >= 1);
}

function materialBreakdownRows(p) {
  const mats = [...(p.materials || [])]
    .map(m => ({ ...m, value: m[currentMetric] }))
    .filter(m => m.value > 0)
    .sort((a, b) => b.value - a.value);
  if (mats.length < 1) return '';
  const total = mats.reduce((s, m) => s + m.value, 0);
  let html = `<div class="tt-divider"></div><div class="tt-sub-label">By material</div>`;
  mats.forEach(m => {
    const pct = total > 0 ? (m.value / total * 100) : 0;
    const val = currentMetric === 'mass' ? fmtMass(m.mass) : fmtWe(m.we);
    html += `<div class="tt-row tt-row-sm"><span class="tt-dot" style="background:${CAT_COLOR[m.famLabel] || '#888'}"></span><div class="tt-name">${m.label}</div><div class="tt-val">${val} <span style="color:var(--text-mute);font-weight:400;">(${pct.toFixed(0)}%)</span></div></div>`;
  });
  return html;
}

function showTreeTooltip(e, p, focusMaterial) {
  const wePct = totalOf('we') > 0 ? (p.we / totalOf('we') * 100) : 0;
  const massPct = totalOf('mass') > 0 ? (p.mass / totalOf('mass') * 100) : 0;
  const isDispose = p.label === 'Dispose';
  let html;
  if (focusMaterial) {
    const pathwayVal = p[currentMetric] || 0;
    const share = pathwayVal > 0 ? (focusMaterial[currentMetric] / pathwayVal * 100) : 0;
    html = `<div class="tt-title"><span class="tt-dot" style="background:${CAT_COLOR[focusMaterial.famLabel] || '#888'}"></span>${focusMaterial.label} <span style="color:var(--text-mute);font-weight:400;">in ${p.label}</span></div>`;
    html += `<div class="tt-row"><div class="tt-name">Assets</div><div class="tt-val">${focusMaterial.count}</div></div>`;
    html += `<div class="tt-row"><div class="tt-name">Mass</div><div class="tt-val">${fmtMass(focusMaterial.mass)}</div></div>`;
    html += `<div class="tt-row"><div class="tt-name">${isDispose ? 'Emissions emitted' : 'Emissions saved'}</div><div class="tt-val ${isDispose ? 'emit' : 'save'}">${fmtWe(focusMaterial.we)}</div></div>`;
    html += `<div class="tt-divider"></div>`;
    html += `<div class="tt-row"><div class="tt-name">Share of ${p.label}</div><div class="tt-val">${share.toFixed(1)}%</div></div>`;
  } else {
    html = `<div class="tt-title"><span class="tt-dot" style="background:${p.color}"></span>${p.label}</div>`;
    html += `<div class="tt-row"><div class="tt-name">Assets</div><div class="tt-val">${p.count}</div></div>`;
    html += `<div class="tt-row"><div class="tt-name">Mass</div><div class="tt-val">${fmtMass(p.mass)} <span class="tt-pct">(${massPct.toFixed(1)}%)</span></div></div>`;
    html += `<div class="tt-row"><div class="tt-name">${isDispose ? 'Emissions emitted' : 'Emissions saved'}</div><div class="tt-val ${isDispose ? 'emit' : 'save'}">${fmtWe(p.we)}</div></div>`;
    html += `<div class="tt-divider"></div>`;
    html += `<div class="tt-row"><div class="tt-name">Share by ${currentMetric === 'mass' ? 'mass' : 'emissions'}</div><div class="tt-val">${(currentMetric === 'mass' ? massPct : wePct).toFixed(1)}%</div></div>`;
    html += materialBreakdownRows(p);
  }
  treeTooltip.innerHTML = html;
  treeTooltip.style.display = 'block';
  positionTreeTooltip(e);
}
function hideTreeTooltip() { treeTooltip.style.display = 'none'; }

function buildSubTiles(el, r) {
  const items = [...r.materials]
    .map(m => ({ ...m, value: m[currentMetric] }))
    .filter(m => m.value > 0)
    .sort((a, b) => b.value - a.value);
  if (items.length < 1) return;

  const subRects = treemapLayout(items, 0, 0, r.w, r.h); // local coords within el
  subRects.forEach(sr => {
    const base = CAT_COLOR[sr.famLabel] || '#888';
    const blended = tileColor(base);
    const tinySub = sr.w < 46 || sr.h < 26;
    // Same border-box chrome-overflow issue as .tile, scaled to .subtile's padding/border
    // (16px wide / 12px tall of chrome) — strip it for slices thinner than that.
    const sliverSub = sr.w < 16 || sr.h < 12;
    const sub = document.createElement('div');
    sub.className = 'subtile' + (tinySub ? ' tiny' : '') + (sliverSub ? ' sliver' : '');
    sub.style.left = sr.x + 'px'; sub.style.top = sr.y + 'px';
    sub.style.width = sr.w + 'px'; sub.style.height = sr.h + 'px';
    sub.style.background = blended;
    sub.style.color = textColorFor(blended);
    const subVal = currentMetric === 'mass' ? fmtMass(sr.mass) : fmtWe(sr.we);
    sub.innerHTML = `<div class="st-name">${sr.label}</div><div class="st-val">${subVal}</div>`;
    sub.addEventListener('mouseenter', ev => { ev.stopPropagation(); showTreeTooltip(ev, r, sr); });
    sub.addEventListener('mousemove', ev => { ev.stopPropagation(); positionTreeTooltip(ev); });
    el.appendChild(sub);
  });
}

function renderTree() {
  const cw = treeContainer.clientWidth, ch = treeContainer.clientHeight;
  const items = [...PATHWAYS]
    .filter(p => p[currentMetric] > 0)
    .sort((a, b) => b[currentMetric] - a[currentMetric])
    .map(p => ({ ...p, value: p[currentMetric] }));

  const rects = treemapLayout(items, 0, 0, cw, ch);
  treeContainer.innerHTML = '';
  const total = totalOf(currentMetric);

  rects.forEach(r => {
    const pct = total > 0 ? (r.value / total * 100) : 0;
    const isTiny = r.w < 84 || r.h < 32;
    // .tile's chrome (padding + border) is 24px wide / 22px tall; below that,
    // border-box clamps content to 0 but still renders at least that much chrome,
    // so the box overflows its allocated slot. Strip the chrome down for slivers.
    const isSliver = r.w < 24 || r.h < 22;
    const isDispose = r.label === 'Dispose';
    const blended = tileColor(r.color);
    const el = document.createElement('div');
    el.className = 'tile' + (isTiny ? ' tiny' : '') + (isSliver ? ' sliver' : '');
    el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
    el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
    el.style.background = blended;
    el.style.color = textColorFor(blended);
    const valLine = currentMetric === 'mass' ? fmtMass(r.mass) : `${fmtWe(r.we)} ${isDispose ? '(emitted)' : '(saved)'}`;
    el.innerHTML = `<div class="t-label"><div class="t-name">${r.label}</div><div class="t-val">${valLine}</div><div class="t-sub">${pct.toFixed(1)}% · ${r.count} asset${r.count === 1 ? '' : 's'}</div></div>`;
    el.addEventListener('mouseenter', e => {
      showTreeTooltip(e, r);
      if (canExpand(r)) {
        el.classList.add('expanded');
        buildSubTiles(el, r);
      }
    });
    el.addEventListener('mousemove', e => positionTreeTooltip(e));
    el.addEventListener('mouseleave', () => {
      hideTreeTooltip();
      el.classList.remove('expanded');
      el.querySelectorAll('.subtile').forEach(s => s.remove());
    });
    treeContainer.appendChild(el);
  });

  document.getElementById('tree-sub').innerHTML = currentMetric === 'mass'
    ? `All diverted + disposed material — Retain excluded. <b>${fmtMass(total)}</b> total. Hover a tile for its material breakdown.`
    : `All diverted + disposed material — Retain excluded. Dispose is <b>emitted</b>; everything else is <b>saved</b>. Hover a tile for its material breakdown.`;
}

window.addEventListener('resize', debounce(renderTree, 100));
document.querySelectorAll('#metric-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#metric-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMetric = btn.dataset.metric;
    renderTree();
  });
});

/* =========================================================================
 * Init — single fetch feeds both panels
 * ========================================================================= */
(async function init() {
  const rawAll = await loadJSONWithFallback('../data/assets.json', 'embedded-assets-json');
  // Construction Waste is a separate material stream, tracked outside the fitout defit dataset — excluded from all totals here.
  const raw = rawAll.filter(r => r.category !== 'Construction Waste' && !r.excludeFromStats);

  DISPOSED_ROWS = raw
    .filter(r => (r.pathway && r.pathway.suggested) === 'Dispose')
    .map(r => ({
      name: r.title,
      matFamily: materialFamily(r.primaryMaterialStream),
      assetCat: r.category || 'Unknown',
      we: (r.wasteEmissions && r.wasteEmissions.potential) || 0,
    }))
    .filter(r => r.we > 0);

  const map = new Map();
  raw.forEach(r => {
    const p = (r.pathway && r.pathway.suggested) || 'Unknown';
    if (p === 'Retain') return; // excluded — retained material never leaves the building
    if (!map.has(p)) map.set(p, { label: p, mass: 0, we: 0, count: 0, materials: new Map() });
    const g = map.get(p);
    const mass = (r.weight && r.weight.total) || 0;
    const we   = (r.wasteEmissions && r.wasteEmissions.potential) || 0;
    g.mass += mass;
    g.we   += we;
    g.count += 1;

    const fam = materialFamily(r.primaryMaterialStream);
    if (!g.materials.has(fam)) g.materials.set(fam, { label: fam, famLabel: fam, mass: 0, we: 0, count: 0, streams: new Set() });
    const m = g.materials.get(fam);
    m.mass += mass;
    m.we   += we;
    m.count += 1;
    if (r.primaryMaterialStream) m.streams.add(r.primaryMaterialStream);
  });
  let fallbackIdx = 0;
  PATHWAYS = Array.from(map.values()).map(p => ({
    ...p,
    // A family bucket fed by a single distinct material stream (e.g. Stewardship's
    // sole Polymer item is carpet tile) shows that full stream name instead of the
    // generic family label — more useful when there's nothing else to disambiguate.
    materials: Array.from(p.materials.values()).map(m => ({
      ...m,
      label: m.streams.size === 1 ? [...m.streams][0] : m.famLabel,
    })),
    color: PATHWAY_COLORS[p.label] || PALETTE_FALLBACK[fallbackIdx++ % PALETTE_FALLBACK.length],
  }));

  renderTree();
})();
</script>
