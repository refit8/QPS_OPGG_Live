<!-- Offline data fallback: embedded copies of the JSON this page fetches,
     used only if fetch() fails (e.g. opened directly via file:// instead of a server). -->
<script>
function loadJSONWithFallback(url, embeddedId) {
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).catch(function(err){
    var el = document.getElementById(embeddedId);
    if (el) {
      try { return JSON.parse(el.textContent); }
      catch (parseErr) { throw err; }
    }
    throw err;
  });
}
</script>

<!--
  AI: Pathway Partner Map — OPGG-BRI
  Standalone page embedded as an iframe in opgg-bri-portal.html (#tab-network).
  Loads ../data/partners.json and renders all 20 pathway partners as pins on a
  Leaflet/OpenStreetMap map, colour-coded by role. Left sidebar shows partner cards
  with role-filter chips. All locations are PLACEHOLDER coordinates — real lat/lng
  to be substituted once Will provides actual addresses.
  Refit8 brand tokens: navy #1E1B5C · orange #E8762B · bg #F4F2EE
-->

<style>
/* ── Refit8 tokens ── */
:root {
  --navy:      #1E1B5C;
  --navy-l:    #2E2A7A;
  --orange:    #E8762B;
  --orange-h:  #D45F18;
  --orange-d:  rgba(232,118,43,0.10);
  --bg:        #F4F2EE;
  --surface:   #ECE9E3;
  --white:     #ffffff;
  --border:    #E2DED6;
  --border-2:  #d4d0c8;
  --ink:       #1b1b1b;
  --ink-2:     #404040;
  --ink-3:     #737373;
  --ink-4:     #a3a3a3;
  --font:      'Geist', system-ui, sans-serif;
  --mono:      'Chivo Mono', monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;

  /* Role colours */
  --c-dispose:    #dc2626;
  --c-steward:    #b45309;
  --c-recycle:    #16a34a;
  --c-tbd:        #6b7280;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg);
  font-family: var(--font);
  font-size: 16.2px;
  color: var(--ink);
}

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: 100%;
}

/* ── SIDEBAR ── */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.sb-header {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-eyebrow {
  font-family: var(--mono);
  font-size: 11.2px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 4px;
}
.sb-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.2;
}
.sb-sub {
  font-size: 13.8px;
  color: var(--ink-3);
  margin-top: 3px;
  font-family: var(--mono);
}

/* Placeholder badge */
.placeholder-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  padding: 4px 10px;
  background: #fef9c3;
  border: 1px solid #fde047;
  border-radius: 99px;
  font-size: 12.5px;
  font-family: var(--mono);
  color: #854d0e;
}

/* Role filter chips */
.sb-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 13.8px;
  font-family: var(--mono);
  font-weight: 500;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .12s;
  background: var(--white);
  border-color: var(--border);
  color: var(--ink-2);
}
.chip:hover { border-color: var(--border-2); background: var(--surface); }
.chip.active { border-color: transparent; color: white; }
.chip.active.all    { background: var(--navy); }
.chip.active.dispose  { background: var(--c-dispose); }
.chip.active.steward  { background: var(--c-steward); }
.chip.active.recycle  { background: var(--c-recycle); }
.chip.active.tbd      { background: var(--c-tbd); }
.chip-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Partner card list */
.sb-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.sb-list::-webkit-scrollbar { width: 4px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.partner-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--white);
  margin-bottom: 6px;
  cursor: pointer;
  transition: all .12s;
}
.partner-card:hover { border-color: var(--border-2); background: var(--surface); }
.partner-card.active { border-color: var(--orange); background: var(--orange-d); }
.partner-card.hidden { display: none; }

.pc-role-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
}
.pc-body { flex: 1; min-width: 0; }
.pc-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-meta {
  font-size: 12.5px;
  color: var(--ink-4);
  font-family: var(--mono);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-role-badge {
  font-size: 11.2px;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: .4px;
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.rb-dispose  { background: #fee2e2; color: #991b1b; }
.rb-steward  { background: #fef3c7; color: #92400e; }
.rb-recycle  { background: #dcfce7; color: #166534; }
.rb-tbd      { background: #f3f4f6; color: #4b5563; }

/* ── MAP PANEL ── */
.map-panel {
  position: relative;
  height: 100%;
}
#map {
  width: 100%;
  height: 100%;
}

/* Leaflet overrides */
.leaflet-container {
  font-family: var(--font);
  background: #e8e0d4;
}

/* Map placeholder banner */
.map-placeholder-banner {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: #fef9c3;
  border: 1px solid #fde047;
  border-radius: 99px;
  padding: 5px 16px;
  font-size: 13.8px;
  font-family: var(--mono);
  color: #854d0e;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

/* Popup styles */
.leaflet-popup-content-wrapper {
  border-radius: 12px !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important;
  border: 1px solid var(--border);
  padding: 0 !important;
  overflow: hidden;
}
.leaflet-popup-content {
  margin: 0 !important;
  min-width: 200px;
}
.leaflet-popup-tip-container { display: none; }

.popup-inner {
  padding: 14px 16px;
}
.popup-role {
  font-size: 11.2px;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: .6px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.popup-name {
  font-size: 16.2px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
}
.popup-row {
  font-size: 13.8px;
  color: var(--ink-2);
  margin-bottom: 3px;
}
.popup-row span {
  color: var(--ink-4);
  font-family: var(--mono);
  font-size: 12.5px;
}
.popup-placeholder {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 11.9px;
  font-family: var(--mono);
  color: #b45309;
}

/* Custom pin SVG markers */
.pin-svg {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Map tile attribution */
.leaflet-control-attribution {
  font-size: 11.2px !important;
}
</style>
</head>

function initMap() {
  MAP = L.map('map', {
    center: [-33.86, 151.20],
    zoom: 6,
    zoomControl: true,
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(MAP);
}

/* ── Custom SVG marker ── */
function makeIcon(color) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <filter id="ds" x="-30%" y="-10%" width="160%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.25)"/>
      </filter>
      <path d="M14 2C8.48 2 4 6.48 4 12c0 7.5 10 22 10 22S24 19.5 24 12c0-5.52-4.48-10-10-10z"
            fill="${color}" filter="url(#ds)" stroke="white" stroke-width="1.5"/>
      <circle cx="14" cy="12" r="4.5" fill="white" fill-opacity="0.9"/>
    </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [28, 36],
    iconAnchor: [14, 36],
    popupAnchor: [0, -38],
  });
}

/* ── Build popup HTML ── */
function popupHtml(p) {
  const color = ROLE_COLORS[p.role];
  const label = ROLE_LABELS[p.role];
  return `
    <div class="popup-inner">
      <div class="popup-role" style="color:${color}">${label}</div>
      <div class="popup-name">${p.name}</div>
      <div class="popup-row"><span>Primary item:</span> ${p.itemMain || '—'}</div>
      <div class="popup-row"><span>Material:</span> ${p.materialMain || '—'}</div>
      <div class="popup-row"><span>Location:</span> ${DUMMY_LOCS[p.name]?.city || 'Unknown'}</div>
      <div class="popup-placeholder">⚠ Placeholder location</div>
    </div>`;
}

/* ── Render partner cards in sidebar ── */
function renderCards() {
  const list = document.getElementById('partnerList');
  list.innerHTML = '';
  partners.forEach((p, i) => {
    const color = ROLE_COLORS[p.role];
    const label = ROLE_LABELS[p.role];
    const badgeCls = ROLE_BADGE_CLASS[p.role];
    const card = document.createElement('div');
    card.className = 'partner-card';
    card.id = 'pc-' + i;
    card.dataset.role = p.role === null ? 'null' : p.role;
    card.innerHTML = `
      <div class="pc-role-dot" style="background:${color}"></div>
      <div class="pc-body">
        <div class="pc-name">${p.name}</div>
        <div class="pc-meta">${p.materialMain || '—'}</div>
      </div>
      <div class="pc-role-badge ${badgeCls}">${label}</div>`;
    card.addEventListener('click', () => selectPartner(i));
    list.appendChild(card);
  });
}

/* ── Render all markers ── */
function renderMarkers() {
  markers.forEach(m => MAP.removeLayer(m));
  markers = [];
  partners.forEach((p, i) => {
    const loc = DUMMY_LOCS[p.name];
    if (!loc) return;
    const color = ROLE_COLORS[p.role];
    const marker = L.marker([loc.lat, loc.lng], { icon: makeIcon(color) })
      .addTo(MAP)
      .bindPopup(popupHtml(p), { maxWidth: 240 });
    marker.on('click', () => {
      highlightCard(i);
    });
    markers.push({ marker, index: i, role: p.role });
  });
}

/* ── Select / highlight a partner ── */
function selectPartner(i) {
  highlightCard(i);
  const entry = markers.find(m => m.index === i);
  if (entry) {
    const loc = DUMMY_LOCS[partners[i].name];
    if (loc) MAP.setView([loc.lat, loc.lng], Math.max(MAP.getZoom(), 10), { animate: true });
    entry.marker.openPopup();
  }
}

function highlightCard(i) {
  document.querySelectorAll('.partner-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('pc-' + i);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

/* ── Role filter ── */
function setFilter(role) {
  activeFilter = role;

  /* Update chip active states */
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.remove('active');
    if (c.dataset.role === role) c.classList.add('active');
  });

  /* Show/hide partner cards */
  document.querySelectorAll('.partner-card').forEach(card => {
    const cardRole = card.dataset.role;
    const show = role === 'all' || cardRole === role;
    card.classList.toggle('hidden', !show);
  });

  /* Show/hide map markers */
  markers.forEach(({ marker, role: mRole }) => {
    const mRoleKey = mRole === null ? 'null' : mRole;
    const show = role === 'all' || mRoleKey === role;
    if (show) {
      if (!MAP.hasLayer(marker)) marker.addTo(MAP);
    } else {
      if (MAP.hasLayer(marker)) MAP.removeLayer(marker);
    }
  });

  /* Update count in sidebar subtitle */
  const visible = partners.filter(p => {
    const pr = p.role === null ? 'null' : p.role;
    return role === 'all' || pr === role;
  }).length;
  document.getElementById('partner-count').textContent =
    visible + (visible === 1 ? ' partner' : ' partners') +
    (role === 'all' ? ' · 4 roles' : ' · ' + (role === 'null' ? 'TBD' : role));
}

/* ── Main init ── */
async function init() {
  initMap();
  try {
    partners = await loadJSONWithFallback('../data/partners.json', 'embedded-partners-json');
  } catch(e) {
    /* Fallback: if fetch fails (e.g. opened directly from filesystem),
       use a minimal placeholder so the UI still renders. */
    console.warn('Could not load partners.json — using fallback data. Serve via npx serve.', e);
    partners = Object.keys(DUMMY_LOCS).map(name => ({
      name, role: null, itemMain: '—', materialMain: '—', location: null, logo: ''
    }));
  }

  renderCards();
  renderMarkers();

  /* Count chips */
  document.getElementById('chip-count-all').textContent = partners.length;
}

init();
</script>
</body>
</html>
