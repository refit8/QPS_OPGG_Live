     used only if fetch() fails (e.g. opened directly via file:// instead of a server). -->
<script>
function loadJSONWithFallback(url, embeddedId) {
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).catch(function(err){
    var el = document.getElementById(embeddedId);
    if (el) {
      try { return JSON.parse(el.textContent); }
      catch (parseErr) { throw err; }
    }
    throw err;
  });
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   PARTNER OUTFLOW DIAGRAM — OPGG-BRI
   Loads ../data/partners.json, filters to featured:true partners,
   then computes an adaptive layout (any role mix, any count).

   To feature a partner: set "featured": true in partners.json.
   To add a one-liner blurb to a tooltip: set "blurb": "..." in partners.json.

   Layout is fully dynamic:
     · Only roles that actually have featured partners are shown
     · Row Y-spacing adjusts to the number of active role groups
     · X step widens when fewer partners per row (more breathing room)
     · Canvas W/H computed from actual node extents
     · Source node Y = vertical midpoint of all partner nodes
═══════════════════════════════════════════════════════════════════ */

/* ── Fixed geometry ── */
// SRC_CX is computed dynamically from the partner layout (see computeLayout)
const SRC_W  = 110, SRC_H = 220;
const R       = 34;            // partner node radius

/* ── Role display config (string keys throughout to avoid null-key JS quirks) ── */
const ROLE = {
  'Adaptive Reuse':  { color:'#0f766e', bg:'#ccfbf1', label:'ADAPTIVE REUSE',  dashed:false },
  'Refurbish':       { color:'#155e75', bg:'#cffafe', label:'REFURBISH',        dashed:false },
  'Remanufacture':   { color:'#1e40af', bg:'#dbeafe', label:'REMANUFACTURE',    dashed:false },
  'Reuse':           { color:'#166534', bg:'#f0fdf4', label:'REUSE',            dashed:false },
  'Rehome':          { color:'#5b21b6', bg:'#ede9fe', label:'REHOME',           dashed:false },
  'Stewardship':     { color:'#854d0e', bg:'#fef9c3', label:'STEWARDSHIP',      dashed:false },
  'Recycle':         { color:'#1a4ba6', bg:'#e8effe', label:'RECYCLE',          dashed:false },
  'Dispose':         { color:'#dc2626', bg:'#fee2e2', label:'DISPOSE',          dashed:false },
  'null':            { color:'#9ca3af', bg:'#f3f4f6', label:'TBD',              dashed:true  },
};
const ROLE_ORDER = ['Adaptive Reuse','Refurbish','Remanufacture','Reuse','Rehome','Stewardship','Recycle','Dispose','null'];

/* ── Utilities ── */
function initials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1)
    return name.length <= 3 ? name.toUpperCase() : name.slice(0, 3).toUpperCase();
  return parts.map(p => p[0]).join('').toUpperCase().slice(0, 3);
}

function roleKey(p) {
  return p.role === null || p.role === undefined ? 'null' : p.role;
}

/* ── Single horizontal row layout — all partners spread across the canvas ── */
function computeLayout(featured) {
  const sorted = [...featured].sort((a, b) => {
    const ai = ROLE_ORDER.indexOf(roleKey(a));
    const bi = ROLE_ORDER.indexOf(roleKey(b));
    return ai - bi;
  });

  const NODE_DIAM  = R * 2;   // 68px node diameter
  const H_GAP      = 52;      // horizontal gap between partner circles
  const Y_PARTNER  = 480;     // Y centre for all partner nodes
  const X_START    = 200;     // X centre of first partner (offset clears oversight box)

  const layout = [];
  sorted.forEach((p, idx) => {
    layout.push({
      partner: p,
      x: X_START + R + idx * (NODE_DIAM + H_GAP),
      y: Y_PARTNER,
      role: roleKey(p),
    });
  });

  const allX  = layout.map(d => d.x);
  const minX  = Math.min(...allX);
  const maxX  = Math.max(...allX);

  const cw    = Math.max(maxX + R + 70, 700);
  const ch    = Math.max(Y_PARTNER + R + 75, 510);

  /* Tower horizontally centred over the partner spread */
  const srcCX = Math.round((minX + maxX) / 2);
  const srcCY = 165;

  return { layout, groups: {}, labelY: {}, cw, ch, srcCX, srcCY };
}

/* ── Bezier path — lines fan downward from tower bottom to each partner top ── */
function bezierD(x0, y0, x1, y1) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const cp1y = y0 + dy * 0.55;
  const cp2y = y1 - dy * 0.25;
  return `M ${x0} ${y0} C ${x0 + dx*0.08} ${cp1y} ${x1 - dx*0.08} ${cp2y} ${x1} ${y1}`;
}

/* ── Compute point at t=0.5 on the same cubic bezier ── */
function bezierMidXY(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const cp1x = x0 + dx * 0.08, cp1y = y0 + dy * 0.55;
  const cp2x = x1 - dx * 0.08, cp2y = y1 - dy * 0.25;
  return {
    mx: 0.125*x0 + 0.375*cp1x + 0.375*cp2x + 0.125*x1,
    my: 0.125*y0 + 0.375*cp1y + 0.375*cp2y + 0.125*y1,
  };
}

/* ── Tangent angle at t=0.5 for label rotation ── */
function bezierTangentAngle(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const cp1x = x0 + dx * 0.08, cp1y = y0 + dy * 0.55;
  const cp2x = x1 - dx * 0.08, cp2y = y1 - dy * 0.25;
  const tx = 3 * (0.25*(cp1x-x0) + 0.5*(cp2x-cp1x) + 0.25*(x1-cp2x));
  const ty = 3 * (0.25*(cp1y-y0) + 0.5*(cp2y-cp1y) + 0.25*(y1-cp2y));
  let angle = Math.atan2(ty, tx) * 180 / Math.PI;
  if (angle > 90)  angle -= 180;
  if (angle < -90) angle += 180;
  return angle;
}

    path.setAttribute('class', 'conn-path');
    path.setAttribute('id', `path-${idx}`);

    path.setAttribute('stroke-linecap', 'round');

    svg.appendChild(path);

    /* Return flow — a second curve back to the tower for partners whose material
       came back into the new fitout (e.g. refurbished/adaptively reused on site). */
    if (p.returnFlow) {
      const rx0 = x, ry0 = y - R;
      const rx1 = srcCX, ry1 = srcBottomY;

    const { mx, my } = bezierMidXY(srcCX, srcBottomY, x, y - R);
    const angle = bezierTangentAngle(srcCX, srcBottomY, x, y - R);

    const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

      `rotate(${angle.toFixed(1)}, ${mx.toFixed(1)}, ${my.toFixed(1)})`);
    labelGroup.dataset.role = role;
    svg.appendChild(labelGroup);

    // Text node (appended first so getBBox works)

    labelTxt.setAttribute('y', my);

    labelTxt.setAttribute('letter-spacing', '1.2');
    labelTxt.setAttribute('font-weight', '700');
    labelTxt.textContent = cfg.label;
    labelGroup.appendChild(labelTxt);

    // White pill background — size estimated from text length (avoids getBBox font-loading race)
    const estCharW = 7.0; // Chivo Mono size 10 + letter-spacing 1.2
    const estW = cfg.label.length * estCharW;
    const estH = 11;
    const pad = { x: 6, y: 3 };
    const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');

    bgRect.setAttribute('y',      my - estH / 2 - pad.y);
    bgRect.setAttribute('width',  estW + pad.x * 2);
    bgRect.setAttribute('height', estH + pad.y * 2);
    bgRect.setAttribute('rx', '3');
    bgRect.setAttribute('fill', 'white');
    bgRect.setAttribute('stroke', '#d1d5db');
    bgRect.setAttribute('stroke-width', '0.75');
    labelGroup.insertBefore(bgRect, labelTxt); // rect sits behind text

    /* Node div */
    const node = document.createElement('div');
    node.className = 'pnode';
    node.id = `pnode-${idx}`;
    node.dataset.role = role;
    Object.assign(node.style, {
      left: (x - R) + 'px',
      top:  (y - R) + 'px',

    });

    const ini = initials(p.name);
    node.innerHTML = `
      <div class="pnode-wrap"
           style="width:${R*2}px;height:${R*2}px;border-color:${cfg.color};background:${cfg.bg}">
        <img class="pnode-logo"
             src="../data/images/logos/${p.logo || ''}"

             style="background:${cfg.bg};color:${cfg.color};display:none">${ini}</div>

      <div class="pnode-name">${p.name}</div>`;

    node.addEventListener('mouseenter', e => onEnter(idx, e));
    node.addEventListener('mousemove',  e => onMove(e));
    node.addEventListener('mouseleave', ()  => onLeave(idx));
    node.addEventListener('click',      ()  => onClick(idx));
    nodesLayer.appendChild(node);

    return { partner: p, x, y, role, path, node, cfg, labelGroup };
  });

  /* ── RETAIN label drawn last so it paints on top of all partner flow lines ── */
  const retainLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  retainLabel.setAttribute('x', retainMidX);

  const retainEstW = 'RETAIN'.length * 7.0; // 42px
  const retainEstH = 11;
  const retainPad = { x: 6, y: 3 };
  const retainBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  retainBg.setAttribute('x',      retainMidX - retainEstW / 2 - retainPad.x);
  retainBg.setAttribute('y',      retainMidY - retainEstH / 2 - retainPad.y);
  retainBg.setAttribute('width',  retainEstW + retainPad.x * 2);
  retainBg.setAttribute('height', retainEstH + retainPad.y * 2);
  retainBg.setAttribute('rx', '3');
  retainBg.setAttribute('fill', 'white');
  retainBg.setAttribute('fill-opacity', '1');
  retainBg.setAttribute('stroke', '#d1d5db');
  retainBg.setAttribute('stroke-width', '0.75');
  svg.insertBefore(retainBg, retainLabel);

  buildChips(featured);
  updateCount(featured.length);
}

/* ═══ Interaction ═══ */
const tooltip = document.getElementById('tooltip');

function onEnter(idx, e) {
  if (allItems[idx].node.classList.contains('dimmed')) return;
  const { partner: p, cfg } = allItems[idx];
  allItems[idx].node.classList.add('hovered');
  allItems[idx].path.setAttribute('stroke-width', '2.5');
  allItems[idx].path.setAttribute('stroke-opacity', '0.92');

  const isTBD = p.role === null || p.role === undefined;

  /* hover_display: 'materialMain' | 'itemMain' | null (show both) */
  let hoverField;
  if (p.hover_display === 'materialMain') {
    hoverField = `<div class="tt-field"><span class="tt-lbl">Material stream</span><span class="tt-val">${p.materialMain || '—'}</span></div>`;
  } else if (p.hover_display === 'itemMain') {
    hoverField = `<div class="tt-field"><span class="tt-lbl">Primary item</span><span class="tt-val">${p.itemMain || '—'}</span></div>`;
  } else {
    hoverField = `<div class="tt-field"><span class="tt-lbl">Primary item</span><span class="tt-val">${p.itemMain || '—'}</span></div>
    <div class="tt-field"><span class="tt-lbl">Material stream</span><span class="tt-val">${p.materialMain || '—'}</span></div>`;
  }

  tooltip.innerHTML = `
    <div class="tt-role" style="color:${cfg.color}">${cfg.label}</div>
    <div class="tt-name">${p.name}</div>
    ${hoverField}
    ${p.blurb ? `<div class="tt-field"><span class="tt-val" style="font-style:italic;color:var(--ink-3)">${p.blurb}</span></div>` : ''}
    ${isTBD ? '<div class="tt-tbd">Role not yet confirmed — awaiting partner details</div>' : ''}
    ${p.returnFlow ? '<div class="tt-return">↩ Reused in the new fitout</div>' : ''}`;
  positionTooltip(e);
  tooltip.style.display = 'block';
}

function onMove(e) {
  if (tooltip.style.display !== 'none') positionTooltip(e);
}

function onLeave(idx) {
  tooltip.style.display = 'none';
  const item = allItems[idx];
  if (!item) return;
  item.node.classList.remove('hovered');
  const cfg = item.cfg;
  const dashed = cfg.dashed;
  item.path.setAttribute('stroke-width', '1.5');
  item.path.setAttribute('stroke-opacity', dashed ? '0.35' : '0.55');
}


function positionTooltip(e) {
  const tt = document.getElementById('tooltip');
  const vw = window.innerWidth, vh = window.innerHeight;
  const tw = tt.offsetWidth || 220, th = tt.offsetHeight || 110;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + tw > vw - 8) x = e.clientX - tw - 14;
  if (y + th > vh - 8) y = e.clientY - th - 14;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}

function onClick(idx) {
  const item = allItems[idx];
  if (!item) return;
  /* If clicking a node whose role is already active, deactivate.
     If clicking any other node (including dimmed ones), switch to that role. */
  if (activeChip !== null && activeChip !== item.role) {
    /* Switch directly to the new role without toggling off first */
    activeChip = item.role;
    document.querySelectorAll('.chip').forEach(c => {
      const r = c.dataset.role;
      const isActive = r === activeChip;
      c.classList.toggle('active', isActive);
      c.style.background = isActive ? (ROLE[r]?.color || '') : (ROLE[r]?.bg || '');
      c.style.color = isActive ? 'white' : (ROLE[r]?.color || '');
    });
    allItems.forEach((it) => {
      const match = it.role === activeChip;
      it.node.classList.toggle('dimmed', !match);
      it.path.setAttribute('stroke-opacity', match ? (it.cfg.dashed ? '0.35' : '0.55') : '0.08');
      it.labelGroup.setAttribute('opacity', match ? '1' : '0.06');
    });
  } else {
    toggleChip(item.role);
  }
}

/* ── Filter chips ── */
let activeChip = null;

function buildChips(featured) {
  const chipBar = document.getElementById('chipRow');
  if (!chipBar) return;
  const roles = [...new Set(featured.map(p => {
    return (p.role === null || p.role === undefined) ? 'null' : p.role;
  }))];
  const present = ROLE_ORDER.filter(r => roles.includes(r));
  chipBar.innerHTML = present.map(role => {
    const cfg = ROLE[role];
    return `<button class="chip" data-role="${role}"
      style="--chip-color:${cfg.color};background:${cfg.bg};border:1px solid ${cfg.color}33;color:${cfg.color}"
      onclick="toggleChip('${role}')">
      <span class="chip-dot" style="background:${cfg.color}"></span>
      ${cfg.label}
    </button>`;
  }).join('');
}

function toggleChip(role) {
  activeChip = activeChip === role ? null : role;
  document.querySelectorAll('.chip').forEach(c => {
    const isActive = c.dataset.role === activeChip;
    c.classList.toggle('active', isActive);
    if (isActive) {
      c.style.background = ROLE[role]?.color || '';
      c.style.color = 'white';
    } else {
      const r = c.dataset.role;
      c.style.background = ROLE[r]?.bg || '';
      c.style.color = ROLE[r]?.color || '';
    }
  });
  allItems.forEach((item) => {
    const match = !activeChip || item.role === activeChip;
    item.node.classList.toggle('dimmed', !match);
    item.path.setAttribute('stroke-opacity', match ? (item.cfg.dashed ? '0.35' : '0.55') : '0.08');
    item.labelGroup.setAttribute('opacity', match ? '1' : '0.06');
  });
}

function updateCount(n) {
  const el = document.getElementById('tbCount');
  if (el) el.textContent = n + ' partners';
}


/* ═══ Oversight box (project team, no flow lines) ═══ */
function renderOversight(oversight) {
  if (!oversight.length) return;
  const canvas  = document.getElementById('canvas');
  const tooltip = document.getElementById('tooltip');

  const box = document.createElement('div');
  box.className = 'oversight-box';

  const lbl = document.createElement('div');
  lbl.className = 'ob-label';
  lbl.textContent = 'Project Team';
  box.appendChild(lbl);

  const grid = document.createElement('div');
  grid.className = 'ob-grid';

  oversight.forEach(p => {
    const node = document.createElement('div');
    node.className = 'oversight-node';
    const ini = initials(p.name);
    const logoFile = p.logo === 'CharterHall_icon.png' ? 'CharterHall_icon.jpg' : (p.logo || '');
    node.innerHTML = `
      <div class="oversight-wrap">
        <img class="oversight-logo"
             src="../data/images/logos/${logoFile}"
             alt="${p.name}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="oversight-ini" style="display:none">${ini}</div>
      </div>
      <div class="oversight-name">${p.name.split(' ')[0]}</div>`;

    node.addEventListener('mouseenter', e => {
      tooltip.innerHTML = `
        <div class="tt-role" style="color:var(--navy)">Project Team</div>
        <div class="tt-name">${p.name}</div>
        <div class="tt-field">
          <span class="tt-lbl">Role</span>
          <span class="tt-val">${p.role || '\u2014'}</span>
        </div>`;
      positionTooltip(e);
      tooltip.style.display = 'block';
    });
    node.addEventListener('mousemove',  e => positionTooltip(e));
    node.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

    grid.appendChild(node);
  });

  box.appendChild(grid);
  canvas.appendChild(box);
}


/* ═══ Downstream zone (placeholder — not yet modelled) ═══ */
function renderDownstream(items) {
  const canvas  = document.getElementById('canvas');
  const svg     = document.getElementById('svgLines');

  const ald      = items.find(it => it.partner.name === 'ALD');
  const milliken = items.find(it => it.partner.name === 'Milliken');
  if (!ald && !milliken) return;

  /* Geometry — below the partner row */
  const Y_PARTNER   = 480;
  const partnerR    = 34;
  const partnerBotY = Y_PARTNER + partnerR;  // 514
  const zoneLineY   = partnerBotY + 62;       // 576  — horizontal separator
  const nodeY       = zoneLineY + 120;         // 696  — downstream node centres
  const DR          = 26;                      // downstream node radius

  /* Expand canvas height */
  const cw    = parseInt(canvas.style.width)  || 700;
  const newCh = nodeY + DR + 60;
  canvas.style.height = newCh + 'px';
  svg.setAttribute('height',  newCh);
  svg.setAttribute('viewBox', `0 0 ${cw} ${newCh}`);

  /* Horizontal dashed separator line */
  const zoneLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  zoneLine.setAttribute('x1', '20');
  zoneLine.setAttribute('y1', zoneLineY);
  zoneLine.setAttribute('x2', cw - 20);
  zoneLine.setAttribute('y2', zoneLineY);
  zoneLine.setAttribute('stroke', '#c4c4c4');
  zoneLine.setAttribute('stroke-width', '1.4');
  zoneLine.setAttribute('stroke-dasharray', '6,4');
  zoneLine.setAttribute('stroke-linecap', 'round');
  svg.appendChild(zoneLine);

  /* "DOWNSTREAM" label */
  const zoneLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  zoneLabel.setAttribute('x', '24');
  zoneLabel.setAttribute('y', zoneLineY - 7);
  zoneLabel.setAttribute('font-size', '9');
  zoneLabel.setAttribute('fill', '#a3a3a3');
  zoneLabel.setAttribute('font-family', "'Chivo Mono', monospace");
  zoneLabel.setAttribute('letter-spacing', '1.4');
  zoneLabel.setAttribute('font-weight', '700');
  zoneLabel.textContent = 'DOWNSTREAM';
  svg.appendChild(zoneLabel);

  /* Downstream node definitions
     Spaced with 90px step so circles (52px diam) never overlap */
  const GREY_COLOR = '#9ca3af';
  const GREY_BG    = '#f3f4f6';

  const nodes = [];
  if (milliken) {
    /* SaveBOARD sits directly below Milliken */
    nodes.push({
      name: 'SaveBOARD', sub: 'Renasci', logo: 'saveBOARD_logo.png',
      srcX: milliken.x, x: milliken.x,
    });
  }
  if (ald) {
    /* Three material-stream placeholders fanning from ALD, 90px apart */
    nodes.push({ name: 'Metal',        sub: null, logo: null, srcX: ald.x, x: ald.x - 90 });
    nodes.push({ name: 'Timber',       sub: null, logo: null, srcX: ald.x, x: ald.x      });
    nodes.push({ name: 'Plasterboard', sub: null, logo: null, srcX: ald.x, x: ald.x + 90 });
  }

  /* Collision check: nudge SaveBOARD left if it would overlap Metal */
  if (nodes.length === 4) {
    const sb = nodes[0], metal = nodes[1];
    if (Math.abs(sb.x - metal.x) < DR * 2 + 14) {
      sb.x = metal.x - DR * 2 - 18;
    }
  }

  const nodesLayer = document.getElementById('nodesLayer');

  nodes.forEach(d => {
    /* Connection bezier from bottom of source partner to top of downstream node */
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', bezierD(d.srcX, partnerBotY, d.x, nodeY - DR));
    path.setAttribute('stroke', GREY_COLOR);
    path.setAttribute('stroke-width', '1.2');
    path.setAttribute('stroke-opacity', '0.5');
    path.setAttribute('stroke-dasharray', '4,3');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);

    /* Node div */
    const node = document.createElement('div');
    node.className = 'pnode';
    node.style.left = (d.x - DR) + 'px';
    node.style.top  = (nodeY - DR) + 'px';
    node.style.pointerEvents = 'none';

    const ini = d.name.slice(0, 2).toUpperCase();
    const subLine = d.sub
      ? `<div class="pnode-name" style="color:#c4c4c4;font-size:9px;margin-top:-2px">${d.sub}</div>`
      : '';

    /* Show logo if available, else initials */
    const innerContent = d.logo
      ? `<img class="pnode-logo"
              src="../data/images/logos/${d.logo}"
              alt="${d.name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="pnode-ini"
              style="display:none;background:${GREY_BG};color:${GREY_COLOR};font-size:10px">${ini}</div>`
      : `<div class="pnode-ini"
              style="display:flex;background:${GREY_BG};color:${GREY_COLOR};font-size:10px">${ini}</div>`;

    node.innerHTML = `
      <div class="pnode-wrap"
           style="width:${DR*2}px;height:${DR*2}px;
                  border-color:${GREY_COLOR};border-style:dashed;
                  background:${GREY_BG}">
        ${innerContent}
      </div>
      <div class="pnode-name" style="color:${GREY_COLOR}">${d.name}</div>
      ${subLine}`;
    nodesLayer.appendChild(node);
  });
}

/* ── Boot ── */
async function init() {
  try {
    const raw = await loadJSONWithFallback('../data/partners.json', 'embedded-partners-json');
    const featured  = raw.filter(p => p.featured === true);
    const oversight = raw.filter(p => p.oversight === true);
    if (!featured.length) {
      document.getElementById('diagramArea').innerHTML = `
        <div style="text-align:center;color:#9ca3af;font-family:var(--mono);font-size:15px;padding:40px">
          No partners marked featured. Set <code>"featured": true</code> in data/partners.json.
        </div>`;
      return;
    }
    render(featured);
    renderOversight(oversight);
    renderDownstream(allItems);
    buildChips(featured);
    updateCount(featured.length);
  } catch (err) {
    console.warn('[08_partner_flow] Could not load partners.json', err);
    document.getElementById('diagramArea').innerHTML = `
      <div style="text-align:center;color:#9ca3af;font-family:var(--mono);font-size:15px;padding:40px">
        <div style="font-size:35px;margin-bottom:10px">&#9888;</div>
        Launch via <strong>Launch Portal.bat</strong> to load partner data.
      </div>`;
  }
}

init();
</script>
